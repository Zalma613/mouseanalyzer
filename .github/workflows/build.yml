name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            icon_flag: --icon=icon.ico
            file_path: dist/MouseAnalyzer.exe
          - os: macos-latest
            icon_flag: --icon=icon.icns
            file_path: dist/MouseAnalyzer.app

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller opencv-python numpy pandas

    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --windowed ${{ matrix.icon_flag }} --name="MouseAnalyzer" MouseTracker.py

    - name: Upload binaries to Release
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ matrix.file_path }}
