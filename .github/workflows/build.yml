name: Build MouseAnalyzer PRO (.exe & .dmg)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ============================================================================
  # 1. WINDOWS (.EXE) BUILD
  # ============================================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python numpy numba pandas yt-dlp pyinstaller ruff
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install ultralytics

      - name: Verify Required Assets Exist
        shell: pwsh
        run: |
          if (-not (Test-Path "icon.ico")) {
            Write-Error "HIÁNYZIK az icon.ico a repo gyökeréből!"
            exit 1
          }

      - name: Run Linter & Automated Unit / Security Tests (Windows)
        shell: pwsh
        run: |
          ruff check --select E9,F,B MouseTracker.py tests/test_mousetracker.py
          python -m unittest discover -s tests -v

      - name: Build Windows Executable with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile `
            --name "MouseAnalyzer_PRO" `
            --icon "icon.ico" `
            --add-data "icon.ico;." `
            --add-data "icon.icns;." `
            --add-data "eger_kalibracio_profil.json;." `
            --add-data "mouse_pose_ai.pt;." `
            --add-data "rodent_detector.pt;." `
            --add-data "yolov8n-pose.pt;." `
            --add-data "yolov8n.pt;." `
            --collect-all cv2 `
            --collect-all ultralytics `
            --collect-all torchvision `
            --collect-all numba `
            --hidden-import numpy `
            --hidden-import pandas `
            MouseTracker.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MouseAnalyzer-PRO-Windows-x64
          path: dist/MouseAnalyzer_PRO.exe

  # ============================================================================
  # 2. MACOS (.APP & .DMG) BUILD
  # ============================================================================
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & PyObjC
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python numpy numba pandas yt-dlp ultralytics pyinstaller ruff pyobjc-core pyobjc-framework-Cocoa

      - name: Verify macOS Icons Exist
        run: |
          if [ ! -f "icon.icns" ]; then
            echo "HIÁNYZIK az icon.icns a repo gyökeréből!"
            exit 1
          fi

      - name: Run Linter & Automated Unit / Security Tests (macOS)
        run: |
          ruff check --select E9,F,B MouseTracker.py tests/test_mousetracker.py
          python3 -m unittest discover -s tests -v

      - name: Build macOS .app Bundle with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --windowed \
            --name "MouseAnalyzer PRO" \
            --icon "icon.icns" \
            --osx-bundle-identifier "com.zalma.mouseanalyzer.pro" \
            --add-data "icon.icns:." \
            --add-data "icon.ico:." \
            --add-data "eger_kalibracio_profil.json:." \
            --add-data "mouse_pose_ai.pt:." \
            --add-data "rodent_detector.pt:." \
            --add-data "yolov8n-pose.pt:." \
            --add-data "yolov8n.pt:." \
            --collect-all cv2 \
            --collect-all ultralytics \
            --collect-all torchvision \
            --collect-all numba \
            --hidden-import numpy \
            --hidden-import pandas \
            MouseTracker.py

      - name: Ad-Hoc Code Sign .app
        run: |
          codesign --force --deep --sign - "dist/MouseAnalyzer PRO.app"

      - name: Package .app into Installer .dmg
        run: |
          mkdir -p dmg_staging
          cp -r "dist/MouseAnalyzer PRO.app" dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "MouseAnalyzer PRO" \
            -srcfolder dmg_staging \
            -ov -format UDZO \
            "dist/MouseAnalyzer_PRO_macOS.dmg"

      - name: Upload macOS .dmg Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MouseAnalyzer-PRO-macOS-DMG
          path: dist/MouseAnalyzer_PRO_macOS.dmg

  # ============================================================================
  # 3. AUTOMATIKUS GITHUB RELEASE LÉTREHOZÁSA (ha v* tag-et pusholtál)
  # ============================================================================
  create-release:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/MouseAnalyzer-PRO-Windows-x64/MouseAnalyzer_PRO.exe
            release_assets/MouseAnalyzer-PRO-macOS-DMG/MouseAnalyzer_PRO_macOS.dmg
          generate_release_notes: true
