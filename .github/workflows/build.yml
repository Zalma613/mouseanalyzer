name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            icon_flag: --icon=icon.ico
            asset_name: MouseAnalyzer-Windows.exe
          - os: macos-latest
            icon_flag: --icon=icon.icns
            asset_name: MouseAnalyzer-macOS.app

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller opencv-python numpy pandas

    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --windowed ${{ matrix.icon_flag }} --name="MouseAnalyzer" MouseTracker.py

    - name: Upload binaries to Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          dist/MouseAnalyzer.exe
          dist/MouseAnalyzer.app
